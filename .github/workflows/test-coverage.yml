name: Build Documentation and Test Coverage

on:
  push:
    branches: [ main, master ]
    # Version tags additionally trigger the YAML Test Matrix (see the gated
    # "Generate YAML Test Matrix" step) and republish the site with it.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  docs-and-tests:
    runs-on: self-hosted

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lean toolchain
        run: |
          if [ -f lean-toolchain ]; then
            TOOLCHAIN="$(cat lean-toolchain)"
            echo "Lean toolchain: $TOOLCHAIN"
            elan toolchain install "$TOOLCHAIN" || true
          fi
          elan show

      - name: Set up hermetic Python venv
        run: |
          # The self-hosted runner snapshots its PATH into <runner>/.path
          # when it is configured/started; that snapshot can carry a
          # FOREIGN project's venv (one shadowed python3 here — a
          # mid-upgrade pytest in it failed the FFI tests, and the old
          # pip-install fallback even wrote weasyprint into it). Build a
          # per-job venv from an explicit interpreter and prepend it via
          # GITHUB_PATH so every later `python3` — the pytest steps, the
          # cross-language heredoc, suiterunner's python backend, the
          # report and PDF scripts — is hermetic, whatever the runner's
          # ambient PATH says.
          PYBASE=/usr/bin/python3.12
          if [ ! -x "$PYBASE" ]; then PYBASE=/usr/bin/python3; fi
          "$PYBASE" -m venv "$RUNNER_TEMP/ci-venv" || {
            echo "::error::venv creation with $PYBASE failed — the runner needs a python with the venv module (Debian/Ubuntu: apt install python3-venv)"
            exit 1
          }
          # A venv does NOT isolate against PYTHONPATH: its entries come
          # before both the stdlib and the venv's site-packages on
          # sys.path. On this box, ROS setup scripts export
          # PYTHONPATH=/opt/ros/... whose packages register pytest
          # plugins that crash under the venv's interpreter (the origin
          # of the old `-p no:launch_ros` flags). GITHUB_ENV cannot
          # unset, and PYTHONPATH="" would put the cwd on sys.path, so
          # point it at an empty directory; PYTHONNOUSERSITE blocks
          # ~/.local site-packages the same way. Export locally too:
          # the GITHUB_ENV write only affects LATER steps, and the
          # pip/pytest checks below must not load foreign site-packages.
          mkdir -p "$RUNNER_TEMP/ci-venv/empty-pythonpath"
          export PYTHONPATH="$RUNNER_TEMP/ci-venv/empty-pythonpath"
          export PYTHONNOUSERSITE=1
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          echo "PYTHONNOUSERSITE=1" >> "$GITHUB_ENV"
          VPY="$RUNNER_TEMP/ci-venv/bin/python3"
          "$VPY" -m pip install --quiet --disable-pip-version-check --upgrade pip
          "$VPY" -m pip install --quiet --disable-pip-version-check pytest
          "$VPY" --version
          "$VPY" -m pytest --version
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"

      - name: Install weasyprint for PDF generation
        id: weasyprint
        run: |
          # weasyprint requires system libraries: pango, cairo, gdk-pixbuf
          # On RHEL/Fedora these are: pango, cairo, gdk-pixbuf2, libffi-devel
          # On Debian/Ubuntu: libpango-1.0-0, libpangocairo-1.0-0, etc.
          # The self-hosted runner may not have sudo; skip system install if unavailable.
          if sudo -n true 2>/dev/null; then
            if command -v apt-get &>/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2 2>/dev/null || true
            elif command -v dnf &>/dev/null; then
              sudo dnf install -y pango cairo gdk-pixbuf2 libffi-devel 2>/dev/null || true
            fi
          else
            echo "No passwordless sudo — skipping system package install (must be pre-installed)"
          fi
          # Install weasyprint into the CI venv (python3 = the hermetic
          # venv from the previous step, via GITHUB_PATH). Verify by
          # IMPORT, not pip exit status: import is what html-to-pdf.py
          # does, and it also proves the system pango/cairo libraries
          # above are actually present.
          if python3 -c "import weasyprint" 2>/dev/null \
             || { python3 -m pip install --quiet --disable-pip-version-check weasyprint \
                  && python3 -c "import weasyprint" 2>/dev/null; }; then
            echo "has_weasyprint=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::weasyprint unavailable — PDF generation will be skipped"
            echo "has_weasyprint=false" >> "$GITHUB_OUTPUT"
          fi

      # -------------------------------------------------------
      # Phase 1: Build everything
      # -------------------------------------------------------
      - name: Build parser and test tools
        # One combined build (same target set as before, one job graph) so
        # the final "Build completed successfully (N jobs)" line yields the
        # job count for collect-stats (tools/CollectStats.lean reads
        # BUILD_JOBS_TOTAL/BUILD_JOBS_PASSED; reaching the export means
        # every job succeeded, so passed == total).
        run: |
          set -o pipefail
          lake build L4YAML \
            suiterunner tryparse tryroundtrip trydump \
            tests demo explicitkeytests flowtests \
            validationtests dumproundtrip rawparsetests \
            specexamples schemadump scannertests scannerspecexamples \
            adversarialtests mutationtests propertytests productioncoverage \
            limittests \
            flowregressioncheck errorstagediag scalarstagediag \
            2>&1 | tee "$RUNNER_TEMP/lake-build.log"
          if JOBS=$(grep -oE '\([0-9]+ jobs\)' "$RUNNER_TEMP/lake-build.log" | tail -1 | grep -oE '[0-9]+'); then
            echo "BUILD_JOBS_TOTAL=$JOBS" >> "$GITHUB_ENV"
            echo "BUILD_JOBS_PASSED=$JOBS" >> "$GITHUB_ENV"
          else
            echo "::warning::could not parse lake job count — build_jobs will be null in stats.json"
          fi

      # -------------------------------------------------------
      # Phase 2: Run all test suites
      #
      # Runs BEFORE the doc build: the suites are independent of the
      # generated site (they only write docs/reports/), and Phase 3 must
      # regenerate the stats payload (StatsData.lean) from this run's
      # results before Phase 4 elaborates the Verso docs.
      # -------------------------------------------------------
      - name: Run Lean test suites
        run: |
          mkdir -p docs/reports
          bash scripts/run-all-tests.sh docs/reports

      - name: Build C shared library and tryparse_c
        # Build straight into ffi/out — the canonical layout from the
        # ffi/CMakeLists.txt header: suiterunner's c backend runs
        # ffi/out/tryparse_c (Tests/SuiteRunner/Main.lean), the Python
        # steps point L4YAML_LIB at ffi/out/libl4yaml.so, and
        # tryparse_c's BUILD_RPATH ($ORIGIN) finds libl4yaml.so
        # in-place. Assert both artifacts here so a broken C build
        # fails THIS step, not the cross-language comparison later.
        run: |
          cmake -B ffi/out -S ffi
          cmake --build ffi/out
          test -f ffi/out/libl4yaml.so
          test -x ffi/out/tryparse_c

      - name: Build Rust tryparse binary
        run: |
          cd rust/l4yaml
          cargo build --release --example tryparse

      - name: Run Python FFI tests
        run: |
          # pipefail: without it the pipeline's status is tee's 0 and a
          # pytest failure never fails the job.
          set -o pipefail
          RESULTS="docs/reports"
          echo "=== Python FFI Tests ===" | tee "$RESULTS/python-ffi-tests.txt"
          cd "$GITHUB_WORKSPACE"
          L4YAML_LIB="$GITHUB_WORKSPACE/ffi/out/libl4yaml.so" \
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/ffi/out:${LD_LIBRARY_PATH:-}" \
          python3 -m pytest Tests/test_python_ffi.py \
            -v --tb=short --no-header \
            --junitxml="$RESULTS/python-ffi-junit.xml" \
            2>&1 | tee -a "$RESULTS/python-ffi-tests.txt"

      - name: Run Python package tests
        run: |
          # pipefail: see "Run Python FFI tests".
          set -o pipefail
          RESULTS="docs/reports"
          echo "=== Python Package Tests ===" | tee "$RESULTS/python-package-tests.txt"
          cd "$GITHUB_WORKSPACE"
          L4YAML_LIB="$GITHUB_WORKSPACE/ffi/out/libl4yaml.so" \
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/ffi/out:${LD_LIBRARY_PATH:-}" \
          python3 -m pytest python/tests/ \
            -v --tb=short --no-header \
            --junitxml="$RESULTS/python-package-junit.xml" \
            2>&1 | tee -a "$RESULTS/python-package-tests.txt"

      - name: Run cross-language yaml-test-suite comparison
        run: |
          # pipefail: the heredoc python's sys.exit(1) on a backend
          # mismatch must fail this step, not be eaten by tee.
          set -o pipefail
          RESULTS="docs/reports"
          echo "=== Cross-Language yaml-test-suite Comparison ===" | tee "$RESULTS/cross-lang-comparison.txt"
          L4YAML_LIB="$GITHUB_WORKSPACE/ffi/out/libl4yaml.so" \
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/ffi/out:${LD_LIBRARY_PATH:-}" \
          python3 - "$RESULTS" <<'PYEOF' | tee -a "$RESULTS/cross-lang-comparison.txt"
          import subprocess, sys, json, pathlib

          results_dir = pathlib.Path(sys.argv[1])
          BACKENDS = ["lean", "c", "python", "rust"]
          PRESETS = ["unlimited", "default", "strict", "permissive", "safe_tags"]
          suiterunner = ".lake/build/bin/suiterunner"
          results = {}
          all_match = True

          for preset in PRESETS:
              for backend in BACKENDS:
                  cmd = [suiterunner, "--backend", backend, "--limits", preset]
                  proc = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
                  output = proc.stdout + proc.stderr
                  for line in output.splitlines():
                      if "TOTAL:" in line:
                          parts = line.split()
                          p, f, s, t = int(parts[1]), int(parts[3]), int(parts[5]), int(parts[7].strip("()"))
                          results[(backend, preset)] = (p, f, s, t)
                          break
                  else:
                      print(f"ERROR: no TOTAL line for {backend}/{preset}", file=sys.stderr)
                      results[(backend, preset)] = (0, 0, 0, 0)
                      all_match = False

              vals = [results[(b, preset)] for b in BACKENDS]
              if len(set(vals)) != 1:
                  print(f"MISMATCH for preset '{preset}': {dict(zip(BACKENDS, vals))}")
                  all_match = False
              else:
                  p, f, s, t = vals[0]
                  print(f"{preset:12s}: {p} passed, {f} failed, {s} skipped ({t} total) — all 4 backends identical")

          print()
          if all_match:
              print("✓ All backends produce identical results for every preset")
          else:
              print("✗ Backend mismatch detected!")
              sys.exit(1)

          json_data = {}
          for (backend, preset), (p, f, s, t) in results.items():
              json_data.setdefault(preset, {})[backend] = {"passed": p, "failed": f, "skipped": s, "total": t}
          (results_dir / "cross-lang-results.json").write_text(json.dumps(json_data, indent=2))
          PYEOF

      # -------------------------------------------------------
      # Phase 3: Generate HTML reports from test data
      # -------------------------------------------------------
      - name: Generate test result HTML reports
        run: |
          python3 scripts/generate-test-reports.py docs/reports

      - name: Collect stats (kernel-accurate axiom + sorry counts)
        # Runs after every other report under docs/reports/ has landed so
        # the JSON aggregates source-scan, env-scan (via Lean.collectAxioms
        # on the compiled L4YAML environment), and this run's test-runner
        # totals. Two outputs:
        #   * docs/reports/stats.json — published site data (gh-pages).
        #   * doc/Doc/L4YAML/StatsData.lean — this run's payload embedded
        #     as a Lean module (workspace-only overwrite of the committed
        #     placeholder; never committed back). The Phase-4 doc build
        #     IMPORTS it, so Lake tracks the dependency by content hash.
        run: |
          lake exe collect-stats --emit-lean
          test -f docs/reports/stats.json
          grep -q 'statsJson? : Option String := some' doc/Doc/L4YAML/StatsData.lean

      # -------------------------------------------------------
      # Phase 4: Build and generate documentation
      # -------------------------------------------------------
      - name: Build documentation (doc/ sub-project)
        # `:::statsTable` renders from Doc.L4YAML.StatsData — the payload
        # module "Collect stats" regenerated above — so this step must
        # follow it for the table to show THIS run's data. The payload is
        # an import, so Lake tracks it by content hash: correct even if
        # runner-side .lake caching is ever enabled.
        run: |
          cd doc
          lake update
          lake build l4yaml-doc

      - name: Generate L4YAML import graph
        # Renders the runtime module-import graph that the Architecture
        # page embeds at `Architecture/Import-Graph/graphs/import-graph.svg`.
        # The Proofs subtree is excluded — `L4YAML.Surface.Surface` would
        # otherwise pull `L4YAML.Proofs.Production.DocumentProduction`,
        # and merging the full Proofs environment trips a duplicate
        # equation-lemma error in `lake exe graph`. Surface itself is
        # represented via `L4YAML.Surface.Document` (its non-Proofs leaf).
        run: |
          # graphviz `dot` is needed to render the .dot file to .svg.
          if ! command -v dot >/dev/null 2>&1; then
            if sudo -n true 2>/dev/null && command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y graphviz
            elif sudo -n true 2>/dev/null && command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
            else
              echo "::error::graphviz 'dot' not found and no passwordless sudo to install it"
              exit 1
            fi
          fi
          mkdir -p doc/Doc/L4YAML/graphs
          lake build graph
          lake exe graph \
            --to=L4YAML.Scanner.Scanner,L4YAML.Parser.Composition,L4YAML.Surface.Document,L4YAML.Output.Dump,L4YAML.Output.Emitter,L4YAML.FFI.FFI,L4YAML.Schema.Api,L4YAML.Config.Config \
            doc/Doc/L4YAML/graphs/import-graph.dot
          dot -Tsvg doc/Doc/L4YAML/graphs/import-graph.dot \
            -o doc/Doc/L4YAML/graphs/import-graph.svg
          ls -lh doc/Doc/L4YAML/graphs/import-graph.*

      - name: Download theorem dependency graphs from L4YAML.FGM
        # We fetch only the headlines tarball — the ~20 SVGs for headline
        # and categoryCapstone entries embedded directly into the Verso
        # verification doc. The full-catalogue tarball
        # (`theorem-graphs-all.tar.gz`, ~400 SVGs) stays on the GitHub
        # release and is linked from the doc for on-demand download.
        run: |
          mkdir -p doc/Doc/L4YAML/graphs
          REPO="pass/L4YAML.FGM"
          TAG="graphs-latest"
          ASSET="theorem-graphs-headlines.tar.gz"
          API_URL="${GITHUB_SERVER_URL}/api/v3/repos/${REPO}/releases/tags/${TAG}"

          # Fetch the release metadata to find the asset download URL
          ASSET_URL=$(curl -sSf \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "${API_URL}" \
            | python3 -c "
          import sys, json
          release = json.load(sys.stdin)
          for asset in release.get('assets', []):
              if asset['name'] == '${ASSET}':
                  print(asset['url'])
                  sys.exit(0)
          print('ERROR: asset not found', file=sys.stderr)
          sys.exit(1)
          ")

          # Download the asset
          curl -sSfL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${ASSET_URL}" \
            -o "doc/Doc/L4YAML/graphs/${ASSET}"

          # Extract SVGs
          tar xzf "doc/Doc/L4YAML/graphs/${ASSET}" -C doc/Doc/L4YAML/graphs/
          rm -f "doc/Doc/L4YAML/graphs/${ASSET}"
          echo "Downloaded $(ls doc/Doc/L4YAML/graphs/*.svg 2>/dev/null | wc -l) SVG graphs from L4YAML.FGM release"

      - name: Generate Verso documentation
        run: |
          cd doc
          lake exe l4yaml-doc
          echo "Verso HTML generated in doc/_out/html-multi/"

      - name: Copy Verso output to docs/
        run: |
          # docs/reports (test reports + stats.json from Phases 2-3) must
          # survive the site refresh — assemble the new site next to it,
          # carry the reports over, then swap.
          rm -rf docs.new
          cp -r doc/_out/html-multi docs.new
          if [ -d docs/reports ]; then
            cp -r docs/reports docs.new/reports
          fi
          rm -rf docs
          mv docs.new docs
          echo "Verso HTML copied to docs/ (reports preserved)"

      - name: Generate doc-gen4 API documentation
        run: |
          lake build :docs
          cp -r .lake/build/doc docs/api
          echo "doc-gen4 API docs copied to docs/api/"

      # -------------------------------------------------------
      # Phase 5: Generate PDF from HTML
      # -------------------------------------------------------
      - name: Generate PDF documentation
        if: steps.weasyprint.outputs.has_weasyprint == 'true'
        run: |
          # Render from the self-contained single page (emitted by l4yaml-doc), so the
          # document and its PDF bookmark outline are in true document order — not the
          # alphabetical, lossy order a multi-page directory merge produces.
          python3 scripts/html-to-pdf.py \
            doc/_out/html-single/index.html \
            docs/L4YAML.pdf
          echo "PDF generated: docs/L4YAML.pdf"

      - name: Add PDF download link to documentation
        if: steps.weasyprint.outputs.has_weasyprint == 'true'
        run: |
          if [ -f docs/L4YAML.pdf ]; then
            # Inject PDF download link into the landing page after the intro paragraph
            sed -i 's|strategy, security model, and FFI bindings for C, Python, and Rust.</p>|strategy, security model, and FFI bindings for C, Python, and Rust.</p>\n              <p>\n                A PDF version of this manual is available for download:\n<a href="L4YAML.pdf">L4YAML.pdf</a>.</p>|' docs/index.html
            echo "PDF download link added to docs/index.html"
          fi

      # -------------------------------------------------------
      # Phase 5b: YAML Test Matrix (version releases only)
      #
      # Reproduces matrix.yaml.info for THIS commit: builds the L4YAML runtime
      # image from the just-compiled testers, then runs the yaml-test-suite
      # through every processor's yaml-runtimes image and renders the comparison
      # page into docs/matrix/ so the gh-pages publish below carries it.
      #
      # Gated to `v*` tags and manual dispatch — it is heavy (image pulls + the
      # full suite x ~37 views) and the score only changes when L4YAML does.
      # Requires the two forks to be pushed + public:
      #   NicolasRouquette/yaml-runtimes @ l4yaml   (runtime images + list.yaml)
      #   NicolasRouquette/yaml-test-matrix @ l4yaml (matrix generator + driver)
      # -------------------------------------------------------
      - name: Generate YAML Test Matrix (L4YAML vs other processors)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          RUNTIMES_REPO: https://github.com/NicolasRouquette/yaml-runtimes.git
          RUNTIMES_REF: l4yaml
          MATRIX_REPO: https://github.com/NicolasRouquette/yaml-test-matrix.git
          MATRIX_REF: l4yaml
          # Pinned so the matrix matches matrix.yaml.info's snapshot (the `data`
          # head is a bit-identical tree). Bump deliberately.
          TESTSUITE_DATA_REF: data-2022-01-17
        run: |
          set -euo pipefail

          # Preflight: the matrix needs the Docker daemon. If this runner's
          # service account is not in the `docker` group the socket is
          # unreachable (`permission denied ... /var/run/docker.sock`). The
          # matrix is an auxiliary artifact, so skip it with a visible warning
          # rather than failing the whole release job (docs still publish; the
          # "Carry forward" step below keeps the last matrix). Enable it by
          # adding the runner user to the docker group and restarting the runner
          # service — see README "L4YAML and the YAML Test Matrix".
          if ! docker version >/dev/null 2>&1; then
            echo "::warning title=YAML Test Matrix skipped::Docker is not accessible for user '$(id -un)' on this runner (is the runner service account in the 'docker' group?) — skipping matrix generation."
            exit 0
          fi

          WORK="$RUNNER_TEMP/yaml-matrix"
          rm -rf "$WORK"; mkdir -p "$WORK"

          # (1) Package THIS commit's testers into the lean runtime image via the
          #     prebuilt path — no in-Docker recompile, so the matrix scores the
          #     checked-out code rather than the released tarball. The Lean-static
          #     binaries built on this (older-glibc) runner run in bookworm-slim.
          lake build l4yaml-event l4yaml-json
          git clone --depth 1 --branch "$RUNTIMES_REF" "$RUNTIMES_REPO" "$WORK/yaml-runtimes"
          install -D .lake/build/bin/l4yaml-event "$WORK/yaml-runtimes/docker/lean/prebuilt/l4yaml-event"
          install -D .lake/build/bin/l4yaml-json  "$WORK/yaml-runtimes/docker/lean/prebuilt/l4yaml-json"
          # Stamp the actual version into the image's advertised views.csv.
          VER="$(grep -oE 'version := v!"[^"]+"' lakefile.lean | grep -oE '[0-9][0-9.]*' | head -1 || true)"
          [ -n "$VER" ] && sed -i "s/,0\\.5\\.0,/,$VER,/g" "$WORK/yaml-runtimes/docker/lean/info/views.csv" || true
          docker build -t yamlio/alpine-runtime-lean \
            -f "$WORK/yaml-runtimes/docker/lean/prebuilt.dockerfile" \
            "$WORK/yaml-runtimes/docker/lean"

          # (2) Matrix generator + its Perl driver image (carries the CPAN deps
          #     and a docker CLI so it can spawn the runtime containers as
          #     siblings of the host daemon).
          git clone --depth 1 --branch "$MATRIX_REF" "$MATRIX_REPO" "$WORK/yaml-test-matrix"
          docker build -t yaml-test-matrix:driver \
            -f "$WORK/yaml-test-matrix/docker/Dockerfile" "$WORK/yaml-test-matrix/docker"

          # (3) Reference runtimes (published on Docker Hub). Best-effort: a
          #     missing image only drops its own view (see the per-view loop).
          for rt in static python perl node ruby haskell dotnet lua; do
            docker pull -q "yamlio/alpine-runtime-$rt" \
              || echo "::warning::could not pull yamlio/alpine-runtime-$rt — its views will be skipped"
          done

          # (4) Inputs: pinned test-suite data + the fork's runtime list.
          cd "$WORK/yaml-test-matrix"
          git clone --quiet --depth 1 --branch "$TESTSUITE_DATA_REF" \
            https://github.com/yaml/yaml-test-suite yaml-test-suite/data
          wget -qO list.yaml \
            "https://raw.githubusercontent.com/NicolasRouquette/yaml-runtimes/$RUNTIMES_REF/list.yaml"
          mkdir -p matrix/data matrix/tmp

          # (5) Run the pipeline inside the driver. The workspace is bind-mounted
          #     at its own absolute path so the driver's `docker run -v <path>`
          #     mounts resolve on the host; per-view loop keeps one broken
          #     runtime from aborting the whole matrix (--all would `die`).
          DOCKER_GID="$(getent group docker | cut -d: -f3 || true)"
          GROUPADD=""
          [ -n "$DOCKER_GID" ] && GROUPADD="--group-add $DOCKER_GID"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":"$PWD" -w "$PWD" \
            --user "$(id -u):$(id -g)" $GROUPADD \
            yaml-test-matrix:driver \
            sh -eu -c '
              ./bin/expected
              views="$(./bin/run-framework-tests --list)"
              for v in $views; do ./bin/run-framework-tests --view "$v" || echo "::warning::matrix run $v failed"; done
              for v in $views; do ./bin/compare-framework-tests --view "$v" || echo "::warning::matrix compare $v failed"; done
              ./bin/create-matrix
              ./bin/highlight || true
            '

          # (6) Fold the generated site into docs/ for the gh-pages publish.
          cd "$GITHUB_WORKSPACE"
          mkdir -p docs
          rm -rf docs/matrix
          cp -r "$WORK/yaml-test-matrix/matrix/html" docs/matrix
          echo "YAML Test Matrix -> docs/matrix ($(find docs/matrix -type f | wc -l) files)"

      - name: Carry forward the last published YAML Test Matrix
        if: >-
          github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
          || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          # Non-release pushes don't regenerate the matrix; restore the last one
          # from gh-pages so the orphan re-publish below doesn't drop it. When the
          # matrix WAS generated this run, keep it.
          if [ -d docs/matrix ]; then
            echo "matrix generated this run — keeping docs/matrix"
          else
            git fetch --depth 1 origin gh-pages 2>/dev/null || true
            if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
              mkdir -p docs
              if git archive FETCH_HEAD matrix 2>/dev/null | tar -x -C docs 2>/dev/null; then
                echo "restored docs/matrix from gh-pages ($(find docs/matrix -type f 2>/dev/null | wc -l) files)"
              else
                echo "no prior matrix on gh-pages — nothing to carry forward"
              fi
            fi
          fi

      - name: Add YAML Test Matrix link to the documentation landing page
        if: >-
          github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
          || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          if [ -d docs/matrix ] && [ -f docs/index.html ] && ! grep -q 'matrix/index.html' docs/index.html; then
            sed -i 's|strategy, security model, and FFI bindings for C, Python, and Rust.</p>|&\n              <p>Conformance vs other YAML processors on the <a href="https://github.com/yaml/yaml-test-suite">yaml-test-suite</a>: see the <a href="matrix/index.html">YAML Test Matrix</a>.</p>|' docs/index.html \
              && echo "matrix link injected into docs/index.html" \
              || echo "::warning::could not inject matrix link (landing anchor not found)"
          fi

      # -------------------------------------------------------
      # Phase 6: Publish
      #
      # The generated site (docs/) is published to the orphan `gh-pages` branch instead of
      # being committed to main. gh-pages is a single flat commit, replaced (force-pushed)
      # on every publish, so the often-regenerated HTML/JS + API docs + reports + PDF never
      # churn main's history. GitHub Pages: Settings -> Pages -> Deploy from a branch ->
      # gh-pages -> / (root). See scripts/publish-pages.sh.
      # -------------------------------------------------------
      - name: Upload documentation as artifact
        # Never let the convenience artifact block the gh-pages publish below.
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: l4yaml-docs
          # The matrix's per-test detail pages are named with yaml-test-suite
          # IDs that contain colons (e.g. matrix/details/2G84:00.html).
          # upload-artifact rejects colons (NTFS-unsafe filenames), but git and
          # GitHub Pages serve them fine, so the matrix still publishes to
          # gh-pages — just exclude it from the downloadable artifact.
          path: |
            docs
            !docs/matrix/**
          retention-days: 30

      - name: Publish documentation to gh-pages branch
        if: >-
          github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
          || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          # commit-tree needs a committer identity even though nothing is committed on main.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Assemble docs/ as a single orphan commit on gh-pages and force-push it.
          PAGES_PUSH=1 bash scripts/publish-pages.sh

      - name: Comment on PR with coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let coverageLine = 'Statistics unavailable';
            try {
              const coverage = fs.readFileSync('docs/reports/coverage-console.txt', 'utf8');
              coverageLine = coverage.match(/Correct: .*/)?.[0] || coverageLine;
            } catch (e) {}

            let pythonSummary = '';
            try {
              const ffiTests = fs.readFileSync('docs/reports/python-ffi-tests.txt', 'utf8');
              const ffiLine = ffiTests.match(/\d+ passed.*/)?.[0] || '';
              const pkgTests = fs.readFileSync('docs/reports/python-package-tests.txt', 'utf8');
              const pkgLine = pkgTests.match(/\d+ passed.*/)?.[0] || '';
              pythonSummary = `\n\n**Python API Tests:**\n- FFI integration: ${ffiLine}\n- Package tests: ${pkgLine}`;
            } catch (e) {}

            let crossLangSummary = '';
            try {
              const crossLang = fs.readFileSync('docs/reports/cross-lang-comparison.txt', 'utf8');
              const lines = crossLang.split('\n').filter(l => l.includes('identical') || l.includes('MISMATCH') || l.includes('✓') || l.includes('✗'));
              if (lines.length > 0) {
                crossLangSummary = `\n\n**Cross-Language Comparison (4 backends × 5 presets):**\n\`\`\`\n${lines.join('\n')}\n\`\`\``;
              }
            } catch (e) {}

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## L4YAML Documentation & Test Coverage\n\n\`\`\`\n${coverageLine}\n\`\`\`${pythonSummary}${crossLangSummary}\n\n📄 [Download documentation artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });
