name: TAG directive repair and actual proof consumers
on:
  push:
    branches: [fix/tag-directive-uniqueness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install repository-pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Bind source and proof identities
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree} HEAD:L4YAML
          git rev-parse HEAD^ HEAD^:L4YAML
          cat lean-toolchain
          lean --version
          sha256sum Tests/Guards/Proofs/TagDirectiveRepair.lean Tests/Guards/Proofs/TagDirectiveSoundness.lean Tests/Guards/Proofs/TagDirectiveSoundnessIx.lean Tests/Guards/Proofs/TagDirectiveConsumer.lean
      - name: Build library, affected consumers and executable regressions
        shell: bash
        run: |
          set -euo pipefail
          lake build L4YAML adversarialinstantiation L4YAML.Proofs.Parser.StreamCompleteness L4YAML.Proofs.Serialization.RuntimeScopes L4YAML.Proofs.Serialization.ErrorCensus Tests.Guards.Proofs.TokenGrammarProbes Tests.Guards.Proofs.TokenEventExtractors Tests.Guards.Proofs.TagDirectiveRepair Tests.Guards.Proofs.TagDirectiveSoundness Tests.Guards.Proofs.TagDirectiveSoundnessIx Tests.Guards.Proofs.TagDirectiveConsumer 2>&1 | tee tag-repair-build.log
      - name: Inspect exact theorem axiom profiles
        shell: bash
        run: |
          set -euo pipefail
          for proof in TagDirectiveSoundness TagDirectiveSoundnessIx TagDirectiveConsumer; do
            lake env lean "Tests/Guards/Proofs/$proof.lean"
          done 2>&1 | tee tag-repair-axioms.log
          if grep -E 'sorryAx|_native\.native_decide\.ax' tag-repair-axioms.log; then
            exit 1
          fi
      - name: Run the adversarial suite with the external directive oracle
        shell: bash
        run: |
          set -euo pipefail
          lake exe adversarialinstantiation 2>&1 | tee tag-repair-adversarial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tag-directive-repair-qualification
          path: tag-repair-*.log
          if-no-files-found: error
